<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<!-- Ya es oscura: que los modos oscuros del navegador no la repinten. -->
<meta name="darkreader-lock">
<title>Puerta</title>
<style>
  /* La puerta de fuera de Google (GitHub Pages): la misma pantalla que la de
     Google, pero con la cámara en vivo y la lista de la carroza en el móvil.
     Escanear y buscar no esperan a nadie; las entradas se apuntan aquí al momento
     y se mandan a Google detrás, aunque se vaya la cobertura. */
  :root {
    color-scheme: dark;
    --fondo: #0b0b0f; --panel: #14141b; --panel2: #1b1b24; --borde: #2a2a35;
    --texto: #f4f4f6; --tenue: #9a9aa8;
    --acento: #ff3399; --acento2: #ff7a45; --sobre-acento: #06121a;
    --ok: #3ddc97; --ojo: #ffb547; --mal: #ff6b6b; --info: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--texto); background: var(--fondo);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  .envoltorio { max-width: 30rem; margin: 0 auto; padding: calc(1rem + env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) 6rem max(1rem, env(safe-area-inset-left, 0px)); display: grid; gap: .9rem; }
  .barra { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
  .barra b { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; }
  .barra span { font-size: .8rem; color: var(--tenue); text-align: right; overflow-wrap: anywhere; }
  .carroza { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; margin: 0; overflow-wrap: anywhere; }
  .aforo { background: var(--panel); border: 1px solid var(--borde); border-radius: 1rem; padding: .9rem 1rem; }
  .aforo .cifras { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .aforo .grande { font-size: 1.7rem; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .aforo .grande small { font-size: .95rem; font-weight: 600; color: var(--tenue); letter-spacing: 0; }
  .aforo .faltan { font-weight: 700; color: var(--tenue); font-size: .9rem; }
  .medidor { height: .45rem; border-radius: 99px; background: var(--panel2); margin-top: .6rem; overflow: hidden; }
  .medidor i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), var(--acento2)); transition: width .4s; }
  .conexion { display: flex; align-items: center; gap: .45rem; font-size: .8rem; color: var(--tenue); margin-top: .55rem; }
  .conexion i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--tenue); flex: none; }
  .conexion.bien i { background: var(--ok); }
  .conexion.envia i { background: var(--info); }
  .conexion.sin i { background: var(--ojo); }
  .conexion.sin { color: var(--ojo); }

  /* El visor: la cámara siempre mirando, con el marco donde va el QR. */
  .visor { position: relative; border-radius: 1.2rem; overflow: hidden; background: #000; aspect-ratio: 4 / 3; max-width: 100%; }
  .visor video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .visor .marco { position: absolute; inset: 14% 22%; border-radius: 1rem; box-shadow: 0 0 0 999px rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.85); pointer-events: none; }
  .visor .marco.leido { border-color: var(--ok); }
  .visor .pista { position: absolute; left: 0; right: 0; bottom: .6rem; text-align: center; font-size: .85rem; font-weight: 700; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .visor .apagado { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; padding: 1rem; text-align: center;
    background: linear-gradient(120deg, var(--acento), var(--acento2)); color: var(--sobre-acento); border: 0; width: 100%; cursor: pointer; }
  .visor .apagado svg { width: 2.2rem; height: 2.2rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .visor .apagado b { font-size: 1.3rem; }
  .visor .apagado small { font-size: .85rem; opacity: .85; max-width: 20rem; }
  .foto { justify-self: center; position: relative; font-size: .85rem; color: var(--tenue); text-decoration: underline; cursor: pointer; padding: .2rem .4rem; }
  .foto input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

  .buscar { display: grid; gap: .5rem; }
  .buscar input { height: 3.1rem; border-radius: .9rem; border: 1px solid var(--borde); background: var(--panel); padding: 0 1rem; width: 100%; }
  .buscar input::placeholder { color: var(--tenue); }
  .resultados { display: grid; gap: .4rem; }
  .resultados button { display: grid; gap: .1rem; text-align: left; padding: .7rem .9rem; border-radius: .9rem; border: 1px solid var(--borde); background: var(--panel); cursor: pointer; }
  .resultados .linea { display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
  .resultados small { color: var(--tenue); font-size: .8rem; }
  .vacio { color: var(--tenue); font-size: .85rem; text-align: center; padding: .4rem; }
  .etq { font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: .15rem .45rem; border-radius: .4rem; white-space: nowrap; }
  .etq.ok { background: rgba(61,220,151,.14); color: var(--ok); }
  .etq.ojo { background: rgba(255,181,71,.14); color: var(--ojo); }
  .etq.mal { background: rgba(255,107,107,.14); color: var(--mal); }
  .etq.info { background: rgba(108,182,255,.14); color: var(--info); }
  h2 { margin: .3rem 0 0; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); }
  .ultimas { display: grid; background: var(--panel); border: 1px solid var(--borde); border-radius: 1rem; overflow: hidden; }
  .ultimas div { display: flex; justify-content: space-between; gap: .75rem; padding: .6rem .9rem; font-size: .9rem; }
  .ultimas div + div { border-top: 1px solid var(--borde); }
  .ultimas span { color: var(--tenue); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .aviso { min-height: 1.3rem; text-align: center; font-size: .9rem; color: var(--ojo); }
  .fallos { display: grid; gap: .5rem; }
  .fallo { border: 1px solid var(--mal); background: rgba(255,107,107,.1); border-radius: .9rem; padding: .75rem .9rem; display: grid; gap: .4rem; font-size: .9rem; }
  .fallo b { color: var(--mal); }
  .fallo button { justify-self: end; border: 1px solid var(--borde); background: var(--panel); border-radius: .7rem; padding: .45rem .9rem; font-weight: 700; cursor: pointer; }
  .malo { text-align: center; padding: 4rem 1rem; }
  .malo h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  .malo p { color: var(--tenue); }

  /* La hoja del grupo: tapa toda la pantalla. */
  .hoja { position: fixed; inset: 0; z-index: 10; background: var(--fondo); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .hoja .dentro { max-width: 30rem; margin: 0 auto; padding: env(safe-area-inset-top, 0px) 0 7rem; }
  .franja { padding: 1.3rem 1rem 1.1rem; text-align: center; }
  .franja .icono { font-size: 2.2rem; line-height: 1; font-weight: 900; }
  .franja b { display: block; font-size: 1.35rem; margin-top: .3rem; text-wrap: balance; }
  .franja p { margin: .25rem 0 0; font-size: .92rem; text-wrap: balance; }
  .franja.ok { background: rgba(61,220,151,.14); color: var(--ok); }
  .franja.ojo { background: rgba(255,181,71,.14); color: var(--ojo); }
  .franja.mal { background: rgba(255,107,107,.15); color: var(--mal); }
  .franja.info { background: rgba(108,182,255,.14); color: var(--info); }
  .grupo { padding: 1rem 1rem .4rem; }
  .grupo h1 { margin: 0; font-size: 1.4rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .grupo small { color: var(--tenue); }
  .personas { display: grid; gap: .45rem; padding: .5rem 1rem; }
  .persona { display: flex; align-items: center; gap: .8rem; padding: .75rem .9rem; border-radius: .9rem; border: 1px solid var(--borde); background: var(--panel); cursor: pointer; }
  .persona input { width: 1.5rem; height: 1.5rem; flex: none; accent-color: var(--ok); }
  .persona .quien { min-width: 0; flex: 1; }
  .persona .quien b { display: block; overflow-wrap: anywhere; }
  .persona .dni { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1.05rem; letter-spacing: .08em; color: #d9d9e2; }
  .persona.ya { opacity: .6; cursor: default; }
  .persona.ya .marca { color: var(--info); font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .cobro { margin: .5rem 1rem 0; padding: .9rem 1rem; border-radius: .9rem; border: 1px dashed var(--ojo); color: var(--ojo); display: grid; gap: .5rem; }
  .cobro b { font-size: 1.15rem; }
  .cobro label { display: flex; align-items: center; gap: .6rem; color: var(--texto); }
  .cobro input { width: 7rem; height: 2.8rem; border-radius: .7rem; border: 1px solid var(--borde); background: var(--panel); padding: 0 .8rem; }
  .pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: linear-gradient(transparent, var(--fondo) 30%); padding: 1.2rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
  .pie .fila { max-width: 30rem; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: .6rem; }
  .pie button { height: 3.6rem; border-radius: 1rem; border: 1px solid var(--borde); background: var(--panel); font-weight: 800; cursor: pointer; padding: 0 1.1rem; }
  .pie .principal { background: var(--ok); color: #06140d; border: 0; font-size: 1.08rem; }
  .pie .principal.cobrar { background: var(--ojo); color: #1d1200; }
  .pie button:disabled { opacity: .45; cursor: default; }
  .pie .error { max-width: 30rem; margin: 0 auto .5rem; text-align: center; color: var(--mal); font-size: .9rem; min-height: 1.2rem; }

  .leyendo { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.8); display: grid; place-items: center; font-weight: 700; }
  .tostada { position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: 28rem; margin: 0 auto;
    background: var(--texto); color: var(--fondo); border-radius: 1rem; padding: .8rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: .8rem; font-weight: 700; }
  .tostada button { border: 0; background: transparent; color: #0b57d0; font-weight: 800; cursor: pointer; padding: .4rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="envoltorio malo" id="malo" hidden>
    <h1>Este enlace de puerta no vale</h1>
    <p id="maloTexto">Está apagado o mal copiado. Pide uno nuevo a quien organiza.</p>
  </div>

  <div class="envoltorio" id="pantalla" hidden>
    <div class="barra"><b id="club">Puerta</b><span id="puerta"></span></div>
    <h1 class="carroza" id="carroza">Cargando la lista…</h1>
    <section class="aforo" aria-live="polite">
      <div class="cifras"><span class="grande" id="dentro">…</span><span class="faltan" id="faltan"></span></div>
      <div class="medidor"><i id="medidor"></i></div>
      <div class="conexion" id="conexion"><i></i><span id="conexionTexto">Conectando…</span></div>
    </section>
    <div class="visor">
      <video id="video" playsinline muted autoplay></video>
      <div class="marco" id="marco" hidden></div>
      <div class="pista" id="pista" hidden>Apunta al QR del pase</div>
      <button type="button" class="apagado" id="camara">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
        <b>Escanear pases</b>
        <small id="camaraTexto">Toca para abrir la cámara</small>
      </button>
    </div>
    <label class="foto">¿No va la cámara? Haz una foto al QR
      <input type="file" accept="image/*" capture="environment" id="foto" aria-label="Escanear pase con una foto">
    </label>
    <div class="fallos" id="fallos" role="alert"></div>
    <div class="aviso" id="aviso" role="status"></div>
    <div class="buscar">
      <input type="search" id="buscar" placeholder="Sin pase: nombre, código o cifras del DNI" autocomplete="off" aria-label="Buscar grupo">
      <div class="resultados" id="resultados"></div>
    </div>
    <h2>Últimas entradas</h2>
    <div class="ultimas" id="ultimas"><div><span>Aún no ha entrado nadie.</span></div></div>
  </div>

  <div class="hoja" id="hoja" hidden role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
    <div class="dentro" id="hojaDentro"></div>
  </div>
  <div class="pie" id="pie" hidden>
    <div class="error" id="hojaError" role="alert"></div>
    <div class="fila"><button type="button" id="volver">Volver</button><button type="button" class="principal" id="entrar"></button></div>
  </div>
  <div class="leyendo" id="leyendo" hidden><span id="leyendoTexto">Leyendo el pase…</span></div>
  <div class="tostada" id="tostada" hidden role="status"><span id="tostadaTexto"></span><button type="button" id="deshacer">Deshacer</button></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" integrity="sha384-hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function euros(n) { return (Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',')) + ' €'; }
  function personas(n) { return n === 1 ? '1 persona' : n + ' personas'; }
  function hora(t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function sinTildes(t) { return String(t == null ? '' : t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function nuevoId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }

  /* ---------- El enlace: #s=<despliegue de Google>&k=<clave de la puerta> ----------
     Va detrás de «#»: el navegador nunca lo manda a GitHub. Sólo vale un despliegue
     de Google (en local, para probar, también ?api= en la propia máquina). */
  var h = new URLSearchParams(location.hash.slice(1));
  var LLAVE = String(h.get('k') || '').toLowerCase();
  var S = String(h.get('s') || '');
  var enLocal = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  var API = /^AKfy[A-Za-z0-9_-]{20,120}$/.test(S) ? 'https://script.google.com/macros/s/' + S + '/exec'
    : enLocal && /^http:\/\/(127\.0\.0\.1|localhost):\d+\/exec$/.test(h.get('api') || '') ? h.get('api') : '';
  if (!/^[a-f0-9]{32}$/.test(LLAVE) || !API) { cerrar(''); return; }
  $('pantalla').hidden = false;

  /* ---------- Lo guardado en el móvil ----------
     La lista (nombres y DNI tapado de esta carroza) y las entradas sin mandar. Se
     borra todo si el enlace deja de valer, y la lista no se usa pasadas 18 horas. */
  var PREFIJO = 'puerta-' + LLAVE.slice(0, 12) + '-';
  function leer(k) { try { return JSON.parse(localStorage.getItem(PREFIJO + k) || 'null'); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(PREFIJO + k, JSON.stringify(v)); } catch (e) { /* sin sitio o privado: sigue en memoria */ } }
  function borrarTodo() { ['lista', 'cola', 'fallos'].forEach(function (k) { try { localStorage.removeItem(PREFIJO + k); } catch (e) {} }); }

  var base = leer('lista');                 // la última lista que dio Google
  if (base && !(Date.now() - base.recibida < 18 * 3600000)) base = null;
  var cola = leer('cola') || [];            // entradas y deshacer por mandar, en orden
  var fallos = leer('fallos') || [];        // lo que Google no aceptó: hay que verlo
  var conectado = null, ultimaVez = base ? base.recibida : 0;

  /* ---------- Google ---------- */
  function llamar(accion, datos) {
    var cuerpo = Object.assign({ accion: accion, llave: LLAVE }, datos || {});
    // Texto plano: así el navegador no pregunta antes (sin «preflight»).
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo), cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) { j = null; }
        if (!j) throw new Error('Google no responde bien.');   // sin red o página de error: se reintenta
        if (!j.ok) { var e = new Error(j.error || 'Error'); e.deGoogle = true; throw e; }
        return j.r;
      });
  }
  function esEnlaceMalo(e) { return e && e.deGoogle && /no vale o está apagado|ya no está\. Pide uno nuevo/.test(e.message); }

  // El enlace ya no vale: fuera los nombres del móvil.
  function cerrar(texto) {
    var pendientes = (cola || []).filter(function (o) { return o.tipo === 'entrar'; }).length;
    parar();
    borrarTodo();
    $('pantalla').hidden = true; $('hoja').hidden = true; $('pie').hidden = true; $('tostada').hidden = true;
    $('malo').hidden = false;
    if (texto) $('maloTexto').textContent = texto;
    if (pendientes) $('maloTexto').textContent += ' Quedaron ' + pendientes + ' entradas sin apuntar en la hoja: díselo a quien organiza.';
  }

  /* ---------- Lo que se ve = la lista de Google + lo apuntado aquí y aún sin mandar ---------- */
  function vista() {
    if (!base) return null;
    var v = JSON.parse(JSON.stringify(base));
    cola.forEach(function (o) { aplicar(v, o); });
    return v;
  }
  function aplicar(v, o) {
    var g = v.grupos.filter(function (x) { return x.id === o.id; })[0];
    if (!g) return;
    var n = 0;
    g.personas.forEach(function (p) {
      if (o.numeros.indexOf(p.n) === -1) return;
      if (o.tipo === 'entrar' && !p.entro) { p.entro = o.hora; p.puerta = v.puerta; n++; }
      if (o.tipo === 'deshacer' && p.entro) { p.entro = ''; p.puerta = ''; n--; }
    });
    if (!n) return;   // Google ya lo tenía: no se cuenta dos veces
    g.entrados += n;
    v.cuenta.dentro += n;
    if (o.tipo === 'entrar') {
      if (o.cobro.personas) {
        g.pagados += o.cobro.personas;
        g.estado = g.pagados >= g.total ? 'pagado' : 'parcial';
      }
      v.cuenta.ultimas.unshift({ grupo: g.grupo, n: n, hora: o.hora });
      v.cuenta.ultimas = v.cuenta.ultimas.slice(0, 4);
    }
  }

  /* ---------- Pintar ---------- */
  function color(c) {
    if (!c) return;
    var r = document.documentElement.style, hex = /^#[0-9a-f]{6}$/i;
    if (hex.test(c.a)) r.setProperty('--acento', c.a);
    if (hex.test(c.b)) r.setProperty('--acento2', c.b);
    if (hex.test(c.sobre)) r.setProperty('--sobre-acento', c.sobre);
  }
  function pintar() {
    var v = vista();
    if (!v) return;
    color(v.color);
    document.title = 'Puerta · ' + v.club;
    $('club').textContent = 'Puerta · ' + v.club;
    $('puerta').textContent = v.puerta;
    $('carroza').textContent = v.carroza;
    var c = v.cuenta;
    $('dentro').innerHTML = c.dentro + ' <small>de ' + Math.max(c.esperados, c.dentro) + ' dentro</small>';
    var faltan = c.esperados - c.dentro;
    $('faltan').textContent = faltan > 0 ? 'Faltan ' + faltan : c.esperados ? 'Están todos' : '';
    $('medidor').style.width = (c.esperados ? Math.min(100, Math.round(100 * c.dentro / c.esperados)) : 0) + '%';
    $('ultimas').innerHTML = c.ultimas.length ? c.ultimas.map(function (u) {
      return '<div><b>' + esc(u.grupo) + ' · ' + u.n + '</b><span>' + esc(u.hora) + '</span></div>';
    }).join('') : '<div><span>Aún no ha entrado nadie.</span></div>';
    pintarConexion();
  }
  function pintarConexion() {
    var porMandar = cola.length, caja = $('conexion'), t;
    if (conectado === false) {
      caja.className = 'conexion sin';
      t = 'Sin conexión' + (porMandar ? ' · ' + porMandar + ' por mandar (se mandan solas)' : '') + (ultimaVez ? ' · lista de las ' + hora(ultimaVez) : '');
    } else if (porMandar) {
      caja.className = 'conexion envia';
      t = 'Mandando ' + porMandar + ' a la hoja…';
    } else {
      caja.className = 'conexion' + (conectado ? ' bien' : '');
      t = conectado ? 'Al día · ' + hora(ultimaVez) : 'Conectando…';
    }
    $('conexionTexto').textContent = t;
  }
  function pintarFallos() {
    $('fallos').innerHTML = fallos.map(function (f, i) {

    if (sinMandar) quitarDeLaCola(o);
    else {
      cola.push({ tipo: 'deshacer', op: nuevoId(), cuando: Date.now(), hora: hora(Date.now()), id: o.id, grupo: o.grupo, numeros: o.numeros, cobro: { personas: 0 } });
      guardar('cola', cola);
      mandar();
    }
    pintar();
    tostada('Entrada deshecha' + (o.cobrado && !sinMandar ? '. El cobro sigue apuntado: si fue un error, quítalo en el panel.' : '.'));
  });

  /* ---------- Arranque ---------- */
  pintar();
  pintarFallos();
  refrescar();
  mandar();
  encender();
})();
</script>
</body>
</html>
